server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # SPA sob /universitarios/inter-unaerp/ — TanStack Router lida com rotas client-side
    location /universitarios/inter-unaerp/ {
        try_files $uri $uri/ /universitarios/inter-unaerp/index.html;
    }

    # Raiz redireciona pro path da app
    location = / {
        return 302 /universitarios/inter-unaerp/;
    }

    # Cache estático longo para assets versionados (vite gera hash)
    location /universitarios/inter-unaerp/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sem cache pra index.html
    location = /universitarios/inter-unaerp/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
